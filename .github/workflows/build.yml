name: MeterHUD build and tests
on:
  push:
    branches: [master, feature/updates-and-installer]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MeterHUD.slnx
      - name: Build
        run: dotnet build MeterHUD.slnx -c Release --no-restore
      - name: Test
        run: dotnet test MeterHUD.slnx -c Release --no-build
